<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The contract's recommended policy (section 10.1): no runtime code
     generation; WebAssembly needs 'wasm-unsafe-eval', and the shim loads its
     worklet from a blob: URL. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval'">
<title>Tape Saturator</title>
<link rel="icon" href="icon.svg">
<script src="hostcontext-shim.js"></script>
<link rel="plugin-manifest" href="plugin.json">
<link rel="stylesheet" href="page.css">
</head>
<body>
<main>
  <h1>Tape Saturator</h1>
  <p id="status" role="status">Loading…</p>
  <section id="controls" aria-label="Parameters"></section>
  <section id="meters" aria-label="Meters"></section>
</main>
<script src="page.js"></script>
</body>
</html>
